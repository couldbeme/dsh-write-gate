# Commitments for the live playground (demo/try.mjs): the deterministic story
# rules PLUS a block-severity semantic rule for the tier-2 judge. With the
# judge off, that rule fails closed and blocks every in-scope action — loudly,
# by design; run with a judge (LM Studio up) to see real verdicts.
version: 1

defaults:
  failMode: closed
  judgeBudgetPerStep: 8

commitments:
  - id: no-prod-config
    statement: Never modify production configuration files directly.
    match:
      kinds: [fs-write]
      paths: ["config/prod/**"]

  - id: no-force-push
    statement: Never force-push to a shared branch.
    match:
      kinds: [shell]
      commands: ["git\\s+push\\s+[^\\n]*(-f\\b|--force)"]

  - id: stay-on-task
    statement: Do not modify files unrelated to the assigned task.
    severity: warn
    semantic: true
    match:
      kinds: [fs-write]

  - id: no-user-data-deletion
    statement: Never delete user data or user records.
    semantic: true
    match:
      kinds: [shell, fs-write]
